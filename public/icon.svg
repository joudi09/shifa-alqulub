<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6c757" />
      <stop offset="40%" stop-color="#daa520" />
      <stop offset="70%" stop-color="#c9a227" />
      <stop offset="100%" stop-color="#8b6914" />
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.25)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.05)" />
    </linearGradient>
    <filter id="shadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" />
      <feOffset dx="0" dy="4" result="offsetblur" />
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- الخلفية الرئيسية -->
  <rect width="512" height="512" rx="115" fill="url(#goldGrad)" />
  
  <!-- طبقة شفافة داخلية -->
  <rect x="20" y="20" width="472" height="472" rx="95" fill="url(#innerGrad)" />
  
  <!-- إطار داخلي رفيع -->
  <rect x="36" y="36" width="440" height="440" rx="82" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="2" />
  <rect x="48" y="48" width="416" height="416" rx="72" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1" />

  <!-- رمز الكتاب المفتوح -->
  <g transform="translate(256, 245)" filter="url(#shadow)">
    <!-- الصفحة اليمنى -->
    <path d="M -10 -80 
             Q 60 -95 105 -75 
             L 105 75 
             Q 60 55 -10 70 Z" 
          fill="rgba(255,255,255,0.95)" 
          stroke="white" 
          stroke-width="3" 
          stroke-linejoin="round" />
    
    <!-- الصفحة اليسرى -->
    <path d="M 10 -80 
             Q -60 -95 -105 -75 
             L -105 75 
             Q -60 55 10 70 Z" 
          fill="rgba(255,255,255,0.85)" 
          stroke="white" 
          stroke-width="3" 
          stroke-linejoin="round" />
    
    <!-- خط المنتصف -->
    <line x1="0" y1="-82" x2="0" y2="72" stroke="#8b6914" stroke-width="3" />
    
    <!-- سطور على الصفحة اليمنى -->
    <line x1="20" y1="-55" x2="85" y2="-60" stroke="rgba(139,105,20,0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="-35" x2="85" y2="-40" stroke="rgba(139,105,20,0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="-15" x2="85" y2="-20" stroke="rgba(139,105,20,0.4)" stroke-width="3" stroke-linecap="round" />
    <line x1="20" y1="5" x2="70" y2="0" stroke="rgba(139,105,20,0.4)" stroke-width="3" stroke-linecap="round" />
    
    <!-- سطور على الصفحة اليسرى -->
    <line x1="-20" y1="-55" x2="-85" y2="-60" stroke="rgba(139,105,20,0.3)" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="-35" x2="-85" y2="-40" stroke="rgba(139,105,20,0.3)" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="-15" x2="-85" y2="-20" stroke="rgba(139,105,20,0.3)" stroke-width="3" stroke-linecap="round" />
    <line x1="-20" y1="5" x2="-70" y2="0" stroke="rgba(139,105,20,0.3)" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- هلال صغير في الأعلى -->
  <g transform="translate(256, 130)">
    <circle cx="0" cy="0" r="24" fill="white" opacity="0.9" />
    <circle cx="8" cy="-6" r="20" fill="url(#goldGrad)" />
  </g>

  <!-- نجمة صغيرة بجانب الهلال -->
  <g transform="translate(300, 120)">
    <path d="M 0 -8 L 2 -2 L 8 0 L 2 2 L 0 8 L -2 2 L -8 0 L -2 -2 Z" fill="white" opacity="0.9" />
  </g>
</svg>